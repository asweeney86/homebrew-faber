name: Update formula

# Picks up Formula/faber.rb from the latest Faber release, then installs it on a clean
# runner the way a user would. The main repo's release workflow can also push here
# directly (with a token); this keeps the tap current without one.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo asweeney86/faber --pattern faber.rb --dir new --clobber
          mkdir -p Formula
          if cmp -s new/faber.rb Formula/faber.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp new/faber.rb Formula/faber.rb
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/faber.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/faber.rb
          git commit -m "faber $version"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  verify:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew install asweeney86/faber/faber
      - run: brew test faber
      - run: faber version && faber help | head -3
